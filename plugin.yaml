# OWASP CRS Plugin Descriptor
# https://github.com/coreruleset/plugin-registry

schema_version: 1

plugin:
  name: "drupal-rule-exclusions-plugin"
  description: "CRS rule exclusions for Drupal applications"
  long_description: |
    Provides targeted rule exclusions to eliminate false positives when
    running OWASP CRS in front of Drupal sites. Covers the session cookie,
    password fields, admin configuration pages, form tokens/build IDs, and
    node/content body fields at Paranoia Level 1 and 2.
  type: "official"
  category: "rule-exclusion"
  status: "tested"
  license: "Apache-2.0"
  authors:
    - name: "OWASP CRS Team"
      url: "https://coreruleset.org"
  repository: "https://github.com/coreruleset/drupal-rule-exclusions-plugin"
  keywords:
    - "drupal"
    - "cms"
    - "rule-exclusion"
    - "false-positive"

rule_id_range:
  start: 9506000
  end: 9506999

compatibility:
  crs_version: ">=4.0.0"
  engines:
    - "modsecurity2"
    - "modsecurity3"
    - "coraza"

configuration:
  file: "plugins/drupal-rule-exclusions-config.conf"
  variables:
    - name: "tx.drupal-rule-exclusions-plugin_enabled"
      type: "boolean"
      default: 1
      description: "Enable or disable Drupal rule exclusions (0 to disable)"
